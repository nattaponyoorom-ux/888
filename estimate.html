<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="description" content="ตรวจสอบจำนวนตู้และขอให้เจ้าหน้าที่พิจารณาการเดินทางของคุณ"><title>วางแผนและประเมินราคา | Rail Charter</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="assets/css/print.css"><script type="module" src="assets/js/layout.js"></script><script type="module" src="assets/js/pages/estimate.js"></script></head><body><a class="skip" href="#main">ข้ามไปเนื้อหา</a><header id="site-header"></header><main id="main" class="wrap"><div class="page-intro"><span class="eyebrow">RAIL CHARTER</span><h1>วางแผนและประเมินราคา</h1><p>ตรวจสอบจำนวนตู้และขอให้เจ้าหน้าที่พิจารณาการเดินทางของคุณ</p></div><div id="connection" role="status">กำลังโหลดข้อมูล…</div><form id="estimate-form" class="panel"><fieldset disabled><legend><h2>รายละเอียดการเดินทาง</h2></legend><div class="fields"><label>ประเภทบริการ<select name="service" required><option value="">กำลังโหลด…</option></select></label><label>รูปแบบการเดินทาง<select name="trip" required><option value="">กำลังโหลด…</option></select></label><label>ตู้โดยสาร<select name="carriageId" required><option value="">กำลังโหลด…</option></select></label><label>เส้นทาง<select name="routeId" required><option value="">กำลังโหลด…</option></select></label><label>ประเภทผู้ขอ<select name="customerType" required><option value="GENERAL">บุคคล / หน่วยงานทั่วไป</option><option value="EXEMPT">ขอให้เจ้าหน้าที่พิจารณาสิทธิ์ยกเว้น</option></select></label><label>วันเดินทาง<input type="date" name="date" required></label><label>วันกลับ (กรณีพักค้างคืน)<input type="date" name="returnDate"></label><label>จำนวนตู้<input type="number" name="count" min="1" max="500" value="1" required></label><label>จำนวนผู้โดยสาร<input type="number" name="passengers" min="1" max="100000" value="1" required></label></div><div class="actions"><button id="calculate">ประเมินราคา</button><button type="button" id="check-calendar">ตรวจตู้ว่าง 14 วัน</button></div></fieldset></form><section id="calendar" aria-live="polite"></section><section id="result" aria-live="polite"></section><form id="request-form" class="panel" hidden><h2>ส่งคำขอให้เจ้าหน้าที่ตรวจสอบ</h2><div class="fields"><label>ชื่อผู้ติดต่อ<input type="text" name="name" maxlength="100" required></label><label>หน่วยงาน / คณะ (จำเป็นเมื่อขอพิจารณาสิทธิ์ยกเว้น)<input type="text" name="organisation" maxlength="150" ></label><label>เบอร์โทรศัพท์<input type="tel" name="phone" maxlength="20" required></label><label>อีเมล<input type="email" name="email" maxlength="150" ></label><label>วัตถุประสงค์<input type="text" name="purpose" maxlength="300" ></label></div><label><input type="checkbox" name="consent" required>ยินยอมให้ใช้ข้อมูลติดต่อเพื่อประสานงานตาม <a href="privacy.html" target="_blank" rel="noopener">นโยบายความเป็นส่วนตัว</a></label><div class="actions"><button>ส่งคำขอ</button></div></form><div id="pending" role="status"></div></main><footer id="site-footer" class="wrap"></footer></body></html>
